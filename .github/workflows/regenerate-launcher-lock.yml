name: Regenerate launcher lock

on:
  push:
    branches:
      - review/validation-fixes
    paths:
      - launcher/package.json

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: review/validation-fixes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Regenerate launcher lockfile
        working-directory: launcher
        run: bun install
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/bun.lock
          if git diff --cached --quiet; then
            echo "launcher/bun.lock already matches the manifest"
            exit 0
          fi
          git commit -m "chore: regenerate launcher lockfile"
          git push origin HEAD:review/validation-fixes
