name: Patch Windows Bigger Context test budget

on:
  push:
    branches:
      - feat/codex-router-provider
    paths:
      - .github/workflows/patch-windows-test-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/codex-router-provider

      - name: Patch only the targeted hosted-runner timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/browser-worker-contract.test.ts')
          source = path.read_text()
          marker = 'test("Bigger Context fits mixed-density whole records within both token and composer limits", () => {'
          start = source.index(marker)
          end = source.index('\n\ntest(', start)
          block = source[start:end]
          old = '}, 20_000);'
          new = '}, 60_000);'
          if not block.rstrip().endswith(old):
              raise SystemExit('target timeout shape changed; refusing broad edit')
          block = block.rstrip()[:-len(old)] + new
          path.write_text(source[:start] + block + source[end:])
          PY
          git diff --check
          git diff -- tests/browser-worker-contract.test.ts

      - name: Commit guarded timeout change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-worker-contract.test.ts
          git commit -m 'test: allow hosted Windows Bigger Context budget'
          git push origin HEAD:feat/codex-router-provider
