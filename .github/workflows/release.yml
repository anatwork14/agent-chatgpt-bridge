name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          test -n "$version"
          test "$version" != "null"
          release_tag="v$version"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "$release_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $release_tag" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            runtime_asset: codex-chatgpt-web-darwin-arm64.tar.gz
          - runner: macos-15-intel
            runtime_asset: codex-chatgpt-web-darwin-amd64.tar.gz
          - runner: ubuntu-latest
            runtime_asset: codex-chatgpt-web-linux-amd64.tar.gz
          - runner: windows-latest
            runtime_asset: codex-chatgpt-web-windows-amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Prepare AVX2-independent Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV
      - name: Prepare compatible Linux libnotify
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev binutils
          ./scripts/prepare-linux-libnotify.sh
      - name: Prepare owned AppImage toolset
        if: runner.os == 'Linux'
        run: bun run launcher/scripts/prepare-linux-appimage-tools.cjs
      - run: bun run verify
      - run: bun run app:package
      - name: Verify Linux AppImage ABI on current Arch
        if: runner.os == 'Linux'
        run: |
          artifact="$(find launcher/artifacts -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$artifact"
          docker run --rm -v "$PWD:/work:ro" -e APPIMAGE_PATH="/work/$artifact" archlinux:base \
            sh -lc 'pacman -Sy --noconfirm binutils file glibc alsa-lib at-spi2-core cairo cups gtk3 libx11 libxcb libxcomposite libxdamage libxext libxfixes libxkbcommon libxrandr mesa nspr nss pango >/dev/null && /work/launcher/scripts/smoke-linux-appimage-symbols.sh "$APPIMAGE_PATH"'
      - name: Ensure virtual display is available
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: bun run app:smoke
      - name: Verify embedded macOS runtime signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict launcher/build/runtime/runtime/bun
      - name: Verify packaged macOS application signature
        if: runner.os == 'macOS'
        run: |
          archive="$(find launcher/artifacts -maxdepth 1 -name '*-mac-*.zip' -print -quit)"
          test -n "$archive"
          stage="$(mktemp -d)"
          ditto -x -k "$archive" "$stage"
          codesign --verify --deep --strict --verbose=2 "$stage/Codex Web GPT.app"
      - name: Archive runtime
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.runtime_asset }}" -C launcher/build/runtime .
      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath "${{ matrix.runtime_asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            ${{ matrix.runtime_asset }}
            launcher/artifacts/*.dmg
            launcher/artifacts/*.zip
            launcher/artifacts/*.exe
            launcher/artifacts/*.AppImage
          if-no-files-found: error

  publish-github:
    needs: [preflight, build]
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - run: bun run licenses
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          expected="v$(jq -r .version package.json)"
          test "$RELEASE_TAG" = "$expected"
      - name: Build npm package tarball
        id: npm-pack
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          printf '%s\n' "$pack_json" > npm-pack.json
          tarball="$(jq -r '.[0].filename' npm-pack.json)"
          test -f "$tarball"
          jq -r '.[0].files[].path' npm-pack.json | grep -Fx 'src/cli.ts'
          jq -r '.[0].files[].path' npm-pack.json | grep -Fx 'src/cli/index.ts'

          smoke_dir="$(mktemp -d)"
          printf '{"private":true}\n' > "$smoke_dir/package.json"
          (
            cd "$smoke_dir"
            bun add "$GITHUB_WORKSPACE/$tarball"
            ./node_modules/.bin/agent-chatgpt --help >/dev/null
            ./node_modules/.bin/agent-chatgpt-bridge --help >/dev/null
            ./node_modules/.bin/codex-chatgpt-web --help >/dev/null
          )
          mv "$tarball" release-assets/
          echo "tarball=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
      - name: Add licenses and installers
        run: |
          cp LICENSE release-assets/LICENSE
          cp LICENSES/Bun-1.4.0.md release-assets/Bun-1.4.0.md
          cp LICENSES/libnotify-0.8.7-LGPL-2.1.md release-assets/libnotify-0.8.7-LGPL-2.1.md
          cp dist/THIRD_PARTY_NOTICES.txt release-assets/THIRD_PARTY_NOTICES.txt
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install-launcher.sh release-assets/install-launcher.sh
          cp scripts/install-launcher.ps1 release-assets/install-launcher.ps1
      - name: Flatten release assets
        run: |
          cd release-assets
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "$name" ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            mv "$file" "$name"
          done < <(find . -mindepth 2 -type f -print0 | sort -z)
          find . -mindepth 1 -type d -empty -delete
      - name: Create checksums
        run: |
          cd release-assets
          checksum_file="$(mktemp)"
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > "$checksum_file"
          mv "$checksum_file" checksums.txt
      - name: Verify every built asset is checksummed
        run: |
          cd release-assets
          missing=""
          while IFS= read -r -d '' file; do
            name="${file#./}"
            if [ "$name" = checksums.txt ]; then continue; fi
            if ! awk -v asset="$name" '$2 == asset { found = 1 } END { exit found ? 0 : 1 }' checksums.txt; then
              missing="$missing $name"
            fi
          done < <(find . -type f -print0)
          if [ -n "$missing" ]; then
            echo "checksums.txt is missing entries for:$missing" >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -d '' release_files < <(find release-assets -type f -print0)
          test "${#release_files[@]}" -gt 0
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" "${release_files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              "${release_flags[@]}" \
              --generate-notes
          fi

          published_manifest="$(mktemp)"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name != "checksums.txt") | [.name, .digest] | @tsv' \
            | while IFS=$'\t' read -r name digest; do
                if [[ "$digest" != sha256:* || -z "${digest#sha256:}" ]]; then
                  echo "Published asset has no SHA-256 digest: $name" >&2
                  exit 1
                fi
                printf '%s  %s\n' "${digest#sha256:}" "$name"
              done \
            | LC_ALL=C sort -k2 > "$published_manifest"
          test -s "$published_manifest"
          mv "$published_manifest" release-assets/checksums.txt
          gh release upload "$RELEASE_TAG" release-assets/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          while IFS=$'\t' read -r name digest; do
            if [ "$name" = checksums.txt ]; then continue; fi
            expected="$(awk -v asset="$name" '$2 == asset { print $1 }' release-assets/checksums.txt)"
            if [ -z "$expected" ] || [ "sha256:$expected" != "$digest" ]; then
              echo "Published asset checksum mismatch: $name" >&2
              exit 1
            fi
          done < <(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv')

          local_manifest_digest="$(sha256sum release-assets/checksums.txt | awk '{ print $1 }')"
          remote_manifest_digest="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "checksums.txt") | .digest')"
          test "sha256:$local_manifest_digest" = "$remote_manifest_digest"

  publish-npm:
    needs: [preflight, publish-github]
    if: always() && needs.preflight.result == 'success' && (needs.publish-github.result == 'success' || needs.publish-github.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Verify npm tarball from the release tag
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          printf '%s\n' "$pack_json" > npm-pack.json
          tarball="$(jq -r '.[0].filename' npm-pack.json)"
          test -f "$tarball"
          jq -r '.[0].files[].path' npm-pack.json | grep -Fx 'src/cli.ts'
          jq -r '.[0].files[].path' npm-pack.json | grep -Fx 'src/cli/index.ts'

          smoke_dir="$(mktemp -d)"
          printf '{"private":true}\n' > "$smoke_dir/package.json"
          (
            cd "$smoke_dir"
            bun add "$GITHUB_WORKSPACE/$tarball"
            ./node_modules/.bin/agent-chatgpt --help >/dev/null
            ./node_modules/.bin/agent-chatgpt-bridge --help >/dev/null
          )
      - name: Check npm registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(jq -r .name package.json)"
          package_version="$(jq -r .version package.json)"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect npm publish token
        id: npm-auth
        if: steps.registry.outputs.published != 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.published != 'true' && steps.npm-auth.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - name: Record missing npm credentials
        if: steps.registry.outputs.published != 'true' && steps.npm-auth.outputs.available != 'true'
        run: |
          echo "::warning::npm package was not published because repository secret NPM_TOKEN is not configured."
          {
            echo "### npm publication pending"
            echo
            echo "GitHub release packaging is complete, but npm registry publication requires the repository secret \`NPM_TOKEN\` for the first publish."
          } >> "$GITHUB_STEP_SUMMARY"

