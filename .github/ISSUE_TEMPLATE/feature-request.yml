name: Feature request
description: Propose a focused improvement to the provider-agnostic Agent Bridge collaboration runtime.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Agent Bridge owns persistent collaboration sessions, provider/agent routing, bounded workflows, permissions, protocol surfaces, persistence, and auditability. Provider credential management belongs to the provider/router/client; ARC remains the execution plane and CompanyOS the coordination/product layer.

  - type: textarea
    id: problem
    attributes:
      label: User or system problem
      description: What concrete collaboration/runtime workflow is blocked today, and who encounters it?
    validations:
      required: true

  - type: textarea
    id: current-workflow
    attributes:
      label: Current workflow or workaround
      description: Explain what users/agents do today and why it is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest observable behavior that would solve the problem.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Sessions / transcript / persistence
        - Provider routing / health / fallback policy
        - ChatGPT Web provider
        - codex-router provider plane
        - ACP external-agent adapter
        - JSONL external-agent adapter
        - REST / Responses API
        - MCP
        - CLI
        - Bounded collaboration / roles / policy
        - Launcher / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Architecture and security boundaries
      description: Note provider ownership, credentials, permissions, filesystem/terminal access, cancellation, persistence, audit, budget, or fail-closed implications.
    validations:
      required: true

  - type: textarea
    id: interoperability
    attributes:
      label: Provider / agent interoperability
      description: If relevant, name the provider or agent, protocol, client version, and OS that motivate the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Scope checklist
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: The proposal does not rely on bypassing authentication, access controls, provider limits, or permission boundaries.
          required: true
        - label: The proposal keeps provider credentials with the system that owns them rather than moving them into Agent Bridge.
          required: true
        - label: I understand that opening an issue does not guarantee implementation or acceptance of a pull request.
          required: true
